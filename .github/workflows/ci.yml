name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.4@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.3"
          elixir-version: "1.20.2"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            apps/pidro_server/priv/plts
          key: ${{ runner.os }}-otp-29.0.3-elixir-1.20.2-${{ hashFiles('mix.lock') }}

      - run: mix deps.get --only test
      - run: mix precommit

  container:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag pidro-backend:ci .

  deployment-config:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true
      - run: bundle exec kamal config > /dev/null
      - name: Forbid forward_headers in config/deploy.yml
        # Parses the YAML (any nesting, flow or block style, quoted keys) instead
        # of grepping, so no spelling of the key slips past the policy.
        run: |
          ruby -ryaml -e '
            def walk(node, path, hits)
              case node
              when Hash
                node.each do |key, value|
                  child = path + [key.to_s]
                  hits << child.join(".") if key.to_s == "forward_headers"
                  walk(value, child, hits)
                end
              when Array
                node.each_with_index { |value, index| walk(value, path + [index.to_s], hits) }
              end
            end
            hits = []
            walk(YAML.safe_load_file("config/deploy.yml", aliases: true), [], hits)
            unless hits.empty?
              warn "config/deploy.yml must not set forward_headers (found at: #{hits.join(", ")}); see docs/deployment/kamal_hetzner.md"
              exit 1
            end
          '
      - run: bundle exec bundle-audit check --update
      - run: bash -n .kamal/hooks/* ops/backup-production ops/credo-diff ops/install-backup-timer ops/server/pidro-backup ops/smoke-production
